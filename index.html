<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Para la mujer mas hermosa</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Comic Sans MS', 'Fredoka', cursive, sans-serif;
            user-select: none;
        }

        /* Pantalla de Inicio */
        #intro {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }

        .flower-pulse {
            font-size: 80px;
            animation: pulse 1.5s infinite alternate ease-in-out;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.9));
        }

        .toca-texto {
            color: #ffdf00;
            margin-top: 20px;
            font-size: 22px;
            text-shadow: 0 0 10px #ffdf00;
            text-align: center;
            padding: 0 15px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.18); }
        }
    </style>
</head>
<body>

    <!-- Pantalla de Inicio -->
    <div id="intro">
        <div class="flower-pulse">🌻</div>
        <div class="toca-texto">Un regalo especial... Toca la flor.</div>
    </div>

    <!-- Reproductor de audio local -->
    <audio id="musica" loop preload="auto">
        <source src="flores_amarillas.mp3" type="audio/mpeg">
    </audio>

    <!-- Librerías Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // ==========================================
        // 1. REPRODUCCIÓN DE AUDIO
        // ==========================================
        const audio = document.getElementById('musica');

        function iniciarMusica() {
            audio.currentTime = 0;
            audio.play().catch(e => {
                console.log("Audio no encontrado o bloqueado:", e);
            });
        }

        // ==========================================
        // 2. ESCENA THREE.JS
        // ==========================================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 25, 170);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // ==========================================
        // 3. GALAXIA CON BORDES AMARILLOS
        // ==========================================

        // Base del centro
        const blackHoleGeo = new THREE.SphereGeometry(14.5, 64, 64);
        const blackHoleMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const blackHole = new THREE.Mesh(blackHoleGeo, blackHoleMat);
        scene.add(blackHole);

        // Aro con tonos amarillos
        function createAccretionTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            const center = 512;

            const grad = ctx.createRadialGradient(center, center, 120, center, center, 512);
            grad.addColorStop(0.0, 'rgba(0, 0, 0, 0)');
            grad.addColorStop(0.20, 'rgba(255, 255, 200, 1)');
            grad.addColorStop(0.38, 'rgba(255, 235, 0, 1)');
            grad.addColorStop(0.65, 'rgba(255, 215, 0, 0.95)');
            grad.addColorStop(0.88, 'rgba(255, 200, 0, 0.7)');
            grad.addColorStop(1.0, 'rgba(255, 180, 0, 0)');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 1024);
            return new THREE.CanvasTexture(canvas);
        }

        const ringGeo = new THREE.RingGeometry(14.5, 72, 128);
        const ringMat = new THREE.MeshBasicMaterial({
            map: createAccretionTexture(),
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: true
        });
        const glowingRing = new THREE.Mesh(ringGeo, ringMat);
        glowingRing.rotation.x = Math.PI / 2;
        scene.add(glowingRing);

        // Aura resplandeciente
        function createAuraTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const center = 256;

            const grad = ctx.createRadialGradient(center, center, 30, center, center, 256);
            grad.addColorStop(0.0, 'rgba(255, 235, 100, 0.5)');
            grad.addColorStop(0.4, 'rgba(255, 215, 0, 0.25)');
            grad.addColorStop(0.8, 'rgba(255, 190, 0, 0.08)');
            grad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 512);
            return new THREE.CanvasTexture(canvas);
        }

        const auraMat = new THREE.SpriteMaterial({
            map: createAuraTexture(),
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const auraSprite = new THREE.Sprite(auraMat);
        auraSprite.scale.set(170, 170, 1);
        scene.add(auraSprite);

        // Estrellas
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 1200;
        const posArray = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 600;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMat = new THREE.PointsMaterial({ size: 1.2, color: 0xffffee, transparent: true, opacity: 0.7 });
        const starMesh = new THREE.Points(starsGeo, starsMat);
        scene.add(starMesh);

        // ==========================================
        // 4. MARCO CENTRAL Y ADAPTACIÓN DE IMAGEN
        // ==========================================
        const photoCanvas = document.createElement('canvas');
        photoCanvas.width = 512;
        photoCanvas.height = 512;
        const pCtx = photoCanvas.getContext('2d');

        function renderizarCentro(img = null) {
            pCtx.clearRect(0, 0, 512, 512);

            pCtx.save();
            pCtx.beginPath();
            pCtx.arc(256, 256, 238, 0, Math.PI * 2);
            pCtx.fillStyle = '#000000';
            pCtx.fill();

            if (img) {
                pCtx.clip();
                const aspect = img.width / img.height;
                let dw, dh, dx, dy;
                if (aspect > 1) {
                    dh = 512;
                    dw = 512 * aspect;
                    dx = (512 - dw) / 2;
                    dy = 0;
                } else {
                    dw = 512;
                    dh = 512 / aspect;
                    dx = 0;
                    dy = (512 - dh) / 2;
                }
                pCtx.drawImage(img, dx, dy, dw, dh);
            }
            pCtx.restore();

            pCtx.beginPath();
            pCtx.arc(256, 256, 238, 0, Math.PI * 2);
            pCtx.strokeStyle = '#ffea00';
            pCtx.lineWidth = 16;
            pCtx.stroke();
        }

        renderizarCentro(null);

        const photoTex = new THREE.CanvasTexture(photoCanvas);
        const photoMat = new THREE.SpriteMaterial({ 
            map: photoTex, 
            transparent: true,
            depthTest: true 
        });
        const photoSprite = new THREE.Sprite(photoMat);
        photoSprite.scale.set(27, 27, 1);
        photoSprite.position.set(0, 0, 2);
        scene.add(photoSprite);

        const parejaImg = new Image();
        parejaImg.src = 'pareja.jpg';
        parejaImg.onload = function() {
            renderizarCentro(parejaImg);
            photoTex.needsUpdate = true;
        };
        parejaImg.onerror = function() {
            console.log("No se encontró pareja.jpg. Se mantiene el círculo negro.");
        };

        // ==========================================
        // 5. ELEMENTOS EN ÓRBITA
        // ==========================================
        const orbitGroup = new THREE.Group();
        scene.add(orbitGroup);

        function createTextSprite(text, fontSize = 28, isBold = false) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1024;
            canvas.height = 256;

            const weight = isBold ? 'bold' : 'normal';
            ctx.font = `${weight} ${fontSize * 2}px "Comic Sans MS", "Fredoka", cursive, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.shadowColor = '#ffea00';
            ctx.shadowBlur = 18;
            ctx.fillStyle = '#ffffff';
            ctx.fillText(text, 512, 128);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthTest: true,
                depthWrite: false
            });

            const sprite = new THREE.Sprite(spriteMat);
            const aspect = canvas.width / canvas.height;
            const scaleY = isBold ? 11 : 7.5;
            sprite.scale.set(scaleY * aspect, scaleY, 1);
            return sprite;
        }

        function createFlowerSprite(emojiSymbol, size = 12) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 256;

            ctx.font = '160px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(255, 215, 0, 0.9)';
            ctx.shadowBlur = 20;
            ctx.fillText(emojiSymbol, 128, 128);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthTest: true,
                depthWrite: false
            });

            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(size, size, 1);
            return sprite;
        }

        // Título Principal modificado
        const tituloSprite = createTextSprite('para la mujer mas hermosa', 38, true);
        tituloSprite.position.set(0, 48, 0);
        scene.add(tituloSprite);

        // Frases para orbitar
        const frasesData = [
            { texto: "El campo entero te manda saludos", grande: true },
            { texto: "Contigo las tardes se hacen cortas", grande: true },
            { texto: "Tu cariño no pasa de moda", grande: false },
            { texto: "Aquí siempre tienes un lugar", grande: true },
            { texto: "Contigo el día pesa menos", grande: true },
            { texto: "Un ramo de gracias por estar ahí", grande: false },
            { texto: "21 de septiembre, contigo siempre", grande: false },
            { texto: "Gracias por quedarte siempre", grande: true },
            { texto: "No necesito un motivo para quererte", grande: true },
            { texto: "Un gracias que no necesita fecha", grande: true },
            { texto: "Como el girasol, miro hacia ti", grande: true },
            { texto: "Un girasol para quien ilumina", grande: true },
            { texto: "Esta flor te recuerda cuánto vales", grande: false },
            { texto: "Esta flor guarda un abrazo para ti", grande: false },
            { texto: "Hoy el amarillo lleva tu nombre", grande: false },
            { texto: "Quiero que sepas cuánto importas", grande: false }
        ];

        const elementosFlorales = ['🌻', '💐', '🌼'];

        const totalItems = 45;
        for (let i = 0; i < totalItems; i++) {
            const dataFrase = frasesData[i % frasesData.length];
            const spriteTexto = createTextSprite(dataFrase.texto, dataFrase.grande ? 30 : 20, dataFrase.grande);

            const radius = 65 + Math.random() * 110;
            const angle = (i / totalItems) * Math.PI * 2 + (Math.random() * 0.3);
            const height = (Math.random() - 0.5) * 60;

            spriteTexto.position.x = radius * Math.cos(angle);
            spriteTexto.position.z = radius * Math.sin(angle);
            spriteTexto.position.y = height;

            orbitGroup.add(spriteTexto);

            const emojiSymbol = elementosFlorales[i % elementosFlorales.length];
            const flowerSprite = createFlowerSprite(emojiSymbol, emojiSymbol === '💐' ? 15 : 10);
            flowerSprite.position.x = (radius + 12) * Math.cos(angle + 0.1);
            flowerSprite.position.z = (radius + 12) * Math.sin(angle + 0.1);
            flowerSprite.position.y = height + (Math.random() - 0.5) * 10;

            orbitGroup.add(flowerSprite);
        }

        // ==========================================
        // 6. BUCLE DE ANIMACIÓN
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            orbitGroup.rotation.y += 0.0025;
            glowingRing.rotation.z -= 0.001;
            starMesh.rotation.y -= 0.0003;

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.getElementById('intro').addEventListener('click', function() {
            this.style.opacity = '0';
            setTimeout(() => { this.style.display = 'none'; }, 800);
            iniciarMusica();
        });

        animate();
    </script>
</body>
</html>
